name: On-push review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

# A new push cancels the review of an older head. That loses nothing: the next review covers
# everything since the head its last summary comment names.
concurrency:
  group: on-push-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A pull request from a fork gets no secrets, so the review could only fail there.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run the on-push review
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD COMMIT: ${{ github.event.pull_request.head.sha }}

            Review this pull request as docs/review.md says. If a summary comment of yours names
            the head commit you last reviewed, read the review threads first (`gh api
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`),
            then review only what changed since that commit (`gh api
            repos/${{ github.repository }}/compare/<that commit>...<head commit>`) and what it
            breaks. Without an earlier summary of yours, review the whole pull request.

            Use inline comments for specific lines. Finish with a single summary comment posted
            via `gh pr comment`, naming the head commit you reviewed.
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments*),Bash(gh api repos/${{ github.repository }}/compare/*)"
