name: Release

# Builds one extension from main for the Chrome Web Store and publishes a GitHub Release with the
# zip, tagged <extension>-v<version>, whose body is that version's entry in the extension's
# CHANGELOG.md. Run by hand (Actions → Release → Run workflow); see
# docs/release.md. The zip is uploaded to the store by hand.
on:
  workflow_dispatch:
    inputs:
      extension:
        description: Extension to release (its folder in extensions/)
        type: choice
        required: true
        options:
          - notico
          - confluco
      version:
        description: Version for the manifest, e.g. 0.2.0 (1 to 4 dot-separated integers, higher than the store's last)
        type: string
        required: true

run-name: Release ${{ inputs.extension }} ${{ inputs.version }}

permissions: {}

# One release of an extension at a time. A run is never cancelled halfway through tagging.
concurrency:
  group: release-${{ inputs.extension }}
  cancel-in-progress: false

jobs:
  build:
    name: Build for the store
    # Only the workflow as it is on main may release, so what runs was reviewed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.inputs.outputs.tag }}
      zip: ${{ steps.inputs.outputs.zip }}
      zip-sha256: ${{ steps.zip.outputs.sha256 }}
      notes: ${{ steps.inputs.outputs.notes }}
    env:
      EXTENSION: ${{ inputs.extension }}
      VERSION: ${{ inputs.version }}

    steps:
      # Chrome's rule for a manifest version: 1 to 4 integers from 0 to 65535, without leading
      # zeros, not all zero. The store also needs it to be higher than the last upload's, which
      # only the store knows.
      - name: Check the inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]{0,4})(\.(0|[1-9][0-9]{0,4})){0,3}$ ]]; then
            echo "::error::Version '$VERSION' is not 1 to 4 dot-separated integers without leading zeros."
            exit 1
          fi
          IFS=. read -ra parts <<<"$VERSION"
          nonzero=false
          for part in "${parts[@]}"; do
            if ((part > 65535)); then
              echo "::error::Version '$VERSION' has a part above 65535."
              exit 1
            fi
            if ((part > 0)); then nonzero=true; fi
          done
          if [ "$nonzero" != true ]; then
            echo "::error::Version '$VERSION' is all zeros."
            exit 1
          fi
          tag="$EXTENSION-v$VERSION"
          if gh api "repos/$REPO/git/matching-refs/tags/$tag" --jq '.[].ref' | grep -qx "refs/tags/$tag"; then
            echo "::error::Tag $tag already exists: that version was released before."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "zip=$EXTENSION-$VERSION.zip"
            echo "notes=$EXTENSION-$VERSION-notes.md"
          } >>"$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Record the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency cache: what is released is built only from the lockfile.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The body of the GitHub Release: the version's entry in the extension's changelog, as it is
      # in the commit being built, then the build line. The script fails when the changelog has no
      # entry for the version, which stops the run here, before anything is built or tagged.
      - name: Write the release notes
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          NOTES: ${{ steps.inputs.outputs.notes }}
        run: |
          node scripts/release-notes.ts "extensions/$EXTENSION/CHANGELOG.md" "$VERSION" >"$NOTES"
          printf '\n---\n\nChrome Web Store build of %s %s, from %s.\n' "${EXTENSION^}" "$VERSION" "$SHA" >>"$NOTES"
          cat "$NOTES"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      # Replaces the build "Run checks" made: the version from the input, and no `key` (the store
      # sets the ID) or `version_name` (which marks a development build) in the manifest.
      # package.json keeps its development version.
      - name: Build for the store
        env:
          CRX_STORE_BUILD: "1"
          EXTENSION_VERSION: ${{ inputs.version }}
        run: pnpm --filter "./extensions/$EXTENSION" build

      - name: Check the manifest
        run: |
          manifest="extensions/$EXTENSION/dist/manifest.json"
          jq -e --arg v "$VERSION" '.version == $v and (has("key") | not) and (has("version_name") | not)' "$manifest" >/dev/null || {
            echo "::error::$manifest does not have version $VERSION, no key, and no version_name."
            exit 1
          }

      # The extension's browser tests load extensions/<name>/dist, the build just made. An extension
      # without a test:browser script fails here, so it needs browser tests before it is released.
      - name: Install Chromium
        run: pnpm --filter "./extensions/$EXTENSION" exec playwright install --no-shell chromium

      - name: Run the extension's browser tests
        run: pnpm --filter "./extensions/$EXTENSION" test:browser

      # The store wants manifest.json at the root of the zip. The variable is not named ZIP:
      # Info-ZIP's zip reads $ZIP as default options, so it would write the archive into dist.
      # The zip's SHA-256 goes into the run's summary, which only this run writes, so the
      # maintainer can check the release's zip against it before uploading it to the store
      # (see docs/release.md).
      - name: Zip the build
        id: zip
        env:
          ARCHIVE: ${{ steps.inputs.outputs.zip }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          cd "extensions/$EXTENSION/dist"
          zip -r -X -q "$GITHUB_WORKSPACE/$ARCHIVE" .
          ls -l "$GITHUB_WORKSPACE/$ARCHIVE"
          sha256=$(sha256sum "$GITHUB_WORKSPACE/$ARCHIVE" | cut -d' ' -f1)
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"
          {
            echo "## $ARCHIVE"
            echo
            echo "Built from \`$SHA\`. SHA-256:"
            echo
            echo "\`\`\`"
            echo "$sha256"
            echo "\`\`\`"
          } >>"$GITHUB_STEP_SUMMARY"

      # The zip the release job attaches to the release.
      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.inputs.outputs.zip }}
          path: ${{ steps.inputs.outputs.zip }}
          if-no-files-found: error

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.inputs.outputs.notes }}
          path: ${{ steps.inputs.outputs.notes }}
          if-no-files-found: error

  release:
    name: Tag and publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag and the release
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EXTENSION: ${{ inputs.extension }}
      VERSION: ${{ inputs.version }}
      SHA: ${{ needs.build.outputs.sha }}
      TAG: ${{ needs.build.outputs.tag }}
      ARCHIVE: ${{ needs.build.outputs.zip }}
      ZIP_SHA256: ${{ needs.build.outputs.zip-sha256 }}
      NOTES: ${{ needs.build.outputs.notes }}

    steps:
      - name: Download the zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.notes }}

      # The release gets the zip the build job made and summarized, or none.
      - name: Check the zip
        run: |
          echo "$ZIP_SHA256  $ARCHIVE" | sha256sum --check --strict

      # The tag is made here, on the commit that was built: given a tag that doesn't exist,
      # `gh release create` would make it on the default branch's head, which may be a later commit
      # (--verify-tag below refuses that instead). It fails if the tag exists, so a version is
      # released only once.
      - name: Tag the commit
        run: gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" --silent

      # Published, not a draft: a release records that a version was built and released, whether or
      # not the store accepts it. One the store turns down is followed by the next version.
      # The title names the product as users see it: the folder name with a capital letter
      # (notico → Notico).
      - name: Publish the release
        run: |
          gh release create "$TAG" "$ARCHIVE" --repo "$REPO" --verify-tag \
            --title "${EXTENSION^} $VERSION" \
            --notes-file "$NOTES"
